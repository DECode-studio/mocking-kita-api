<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - Google Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 select-none">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center gap-1.5 font-bold text-lg tracking-tight text-white mb-2">
        <svg class="w-6 h-6" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google Workspace</span>
      </div>
      <h1 class="text-xl font-semibold text-white">Complete Your Profile</h1>
      <p class="text-xs text-slate-400">Please fill in your details to activate your account for <span class="font-semibold text-purple-400">Mock API Studio</span></p>
    </div>

    <!-- Error Alert -->
    <div id="error-box" class="hidden p-3 bg-rose-950/60 border border-rose-800 text-rose-300 text-xs rounded-xl items-center gap-2">
      <span id="error-message"></span>
    </div>

    <form id="reg-form" onsubmit="submitRegistration(event)" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider font-mono">Email Address</label>
        <input type="text" disabled value="{{email}}" class="w-full text-xs px-3.5 py-2.5 bg-slate-950/50 border border-slate-850 rounded-xl text-slate-400 font-mono cursor-not-allowed" />
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider font-mono">Display Name *</label>
        <input id="name-input" type="text" required value="{{name}}" class="w-full text-xs px-3.5 py-2.5 bg-slate-950 border border-slate-850 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/15" />
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider font-mono">Select Role *</label>
        <select id="role-select" class="w-full text-xs px-3.5 py-2.5 bg-slate-950 border border-slate-850 rounded-xl text-slate-100 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/15 cursor-pointer">
          {{rolesOptions}}
        </select>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="submit" class="px-4 py-2 text-xs font-semibold bg-white text-slate-950 hover:bg-slate-100 rounded-xl cursor-pointer">Complete & Sign In</button>
      </div>
    </form>
  </div>

  <script>
    async function submitRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('name-input').value.trim();
      const role = document.getElementById('role-select').value;
      const email = "{{email}}";
      const googleId = "{{googleId}}";

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: email,
            password: '',
            rememberMe: false,
            registerExtra: { name, role, googleId: googleId || undefined }
          })
        });

        const data = await res.json();
        if (!res.ok || data.success === false) {
          const errBox = document.getElementById('error-box');
          document.getElementById('error-message').textContent = data.error || 'Registration failed';
          errBox.classList.remove('hidden');
          return;
        }

        // Success, redirect to callback with success=true to close popup
        window.location.href = '/api/auth/sso/callback?success=true';
      } catch (err) {
        alert('Network error.');
      }
    }
  </script>
</body>
</html>
