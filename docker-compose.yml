services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mock-api-studio:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin123}
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

