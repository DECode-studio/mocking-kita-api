openapi: 3.0.3
info:
  title: Mock API Studio External Integration API
  description: External REST API for third-party platform integration to manage APIs, Request Scenarios, and Response Scenarios.
  version: 1.0.0
servers:
  - url: /api/v1/external
    description: External Integration Base Path

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /auth/signin:
    post:
      summary: Sign-In / External Authentication
      description: |
        Authenticates an external platform user with email/username and password, returning a JWT Access Token.
      operationId: signInExternal
      tags:
        - Authentication
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication successful, returns JWT Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openapi/upsert:
    post:
      summary: Upsert Swagger / OpenAPI Specification
      description: |
        Bulk imports or upserts APIs, Request Scenarios, and Response Scenarios from a Swagger (OpenAPI 2.0) or OpenAPI 3.x specification JSON/YAML.
      operationId: upsertOpenApiSpec
      tags:
        - OpenAPI Import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOpenApiRequest'
      responses:
        '200':
          description: OpenAPI specification successfully imported/upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /apis/upsert:
    put:
      summary: Upsert API by Endpoint
      description: |
        Creates a new API or updates an existing API identified by the combination of `projectId`, `path`, and `methodRequest`.
      operationId: upsertApiByEndpoint
      tags:
        - APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertApiRequest'
      responses:
        '200':
          description: API successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '201':
          description: API successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /apis:
    get:
      summary: Get List of APIs
      description: Retrieves a list of APIs filtered by project, collection, or search term.
      operationId: getListApis
      tags:
        - APIs
      parameters:
        - name: projectId
          in: query
          required: true
          description: Filter APIs by Project ID
          schema:
            type: string
            format: uuid
        - name: collectionId
          in: query
          required: false
          description: Filter APIs by Collection ID
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: Search term for API name or path
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of APIs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /request-scenarios/upsert:
    put:
      summary: Upsert Request Scenario by ID
      description: |
        Creates a new request scenario or updates an existing one identified by `id`.
        If `id` is provided and exists, it performs an update. If `id` does not exist or is omitted, it creates a new request scenario for the given `apiId`.
      operationId: upsertRequestScenarioById
      tags:
        - Request Scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequestScenarioRequest'
      responses:
        '200':
          description: Request scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestScenarioResponse'
        '201':
          description: Request scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /request-scenarios:
    get:
      summary: Get List of Request Scenarios by Endpoint
      description: Retrieves request scenarios for a specific endpoint (identified by `projectId`, `path`, and `methodRequest`) or directly by `apiId`.
      operationId: getListRequestScenariosByEndpoint
      tags:
        - Request Scenarios
      parameters:
        - name: projectId
          in: query
          required: false
          description: Required if filtering by endpoint path & method
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: false
          description: Endpoint URI path (e.g., `/v1/users`)
          schema:
            type: string
        - name: methodRequest
          in: query
          required: false
          description: HTTP Method (e.g., GET, POST)
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
        - name: apiId
          in: query
          required: false
          description: Direct API ID lookup
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of request scenarios retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestScenarioListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /response-scenarios/upsert:
    put:
      summary: Upsert Response Scenario by ID
      description: |
        Creates or updates a response scenario identified by `id`.
        If `id` exists, updates the response scenario. Otherwise creates a new response scenario for the given `requestScenarioId`.
      operationId: upsertResponseScenarioById
      tags:
        - Response Scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertResponseScenarioRequest'
      responses:
        '200':
          description: Response scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseScenarioResponse'
        '201':
          description: Response scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /response-scenarios:
    get:
      summary: Get List of Response Scenarios by Endpoint
      description: Retrieves response scenarios for a specific endpoint (by `projectId`, `path`, and `methodRequest`) or by `requestScenarioId`.
      operationId: getListResponseScenariosByEndpoint
      tags:
        - Response Scenarios
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: false
          schema:
            type: string
        - name: methodRequest
          in: query
          required: false
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
        - name: requestScenarioId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of response scenarios retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseScenarioListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication failed or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SignInRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@example.com"
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password
          example: "P@ssw0rd123!"

    AuthTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Authentication successful"
        data:
          type: object
          properties:
            tokenType:
              type: string
              example: "Bearer"
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expiresIn:
              type: integer
              example: 86400
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                email:
                  type: string
                role:
                  type: string
                name:
                  type: string

    UpsertOpenApiRequest:
      type: object
      required:
        - projectId
        - openApiJson
      properties:
        projectId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-56789abcdef0"
        mode:
          type: string
          enum: [upsert, merge, replace]
          default: upsert
          example: "upsert"
        openApiJson:
          type: object
          description: Raw Swagger 2.0 or OpenAPI 3.x specification JSON
          example:
            openapi: "3.0.0"
            info:
              title: "Payment API"
              version: "1.0.0"

    OpenApiImportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OpenAPI specification imported/upserted successfully"
        data:
          type: object
          properties:
            projectId:
              type: string
              format: uuid
            mode:
              type: string
            importedApis:
              type: integer
            importedRequestScenarios:
              type: integer
            importedResponseScenarios:
              type: integer

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "BAD_REQUEST"
            message:
              type: string
              example: "Invalid parameter 'projectId'"

    # API Models
    UpsertApiRequest:
      type: object
      required:
        - projectId
        - path
        - methodRequest
        - name
      properties:
        projectId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-56789abcdef0"
        collectionId:
          type: string
          format: uuid
          nullable: true
          example: "b2c3d4e5-f6a7-8901-2345-6789abcdef01"
        name:
          type: string
          example: "Get User Details"
        description:
          type: string
          nullable: true
          example: "Fetches user profile information"
        path:
          type: string
          example: "/v1/users/{id}"
        methodRequest:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
          example: "GET"
        status:
          type: boolean
          default: true
          example: true

    ApiData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        path:
          type: string
        methodRequest:
          type: string
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "API upserted successfully"
        action:
          type: string
          enum: [CREATED, UPDATED]
          example: "CREATED"
        data:
          $ref: '#/components/schemas/ApiData'

    ApiListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiData'
        pagination:
          type: object
          properties:
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            totalPages:
              type: integer
              example: 3

    # Request Scenario Models
    UpsertRequestScenarioRequest:
      type: object
      required:
        - apiId
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Optional for new scenario, required to update specific ID
          example: "c3d4e5f6-a7b8-9012-3456-789abcdef012"
        apiId:
          type: string
          format: uuid
          example: "d4e5f6a7-b8c9-0123-4567-89abcdef0123"
        name:
          type: string
          example: "Valid User Request"
        description:
          type: string
          nullable: true
          example: "Matches when user ID header is valid"
        headers:
          type: object
          additionalProperties: true
          example: { "Authorization": "Bearer *" }
        queryParams:
          type: object
          additionalProperties: true
          example: { "include": "details" }
        pathParams:
          type: object
          additionalProperties: true
          example: { "id": "123" }
        body:
          type: object
          additionalProperties: true
          example: { "role": "admin" }
        bodyType:
          type: string
          enum: [JSON, FORM_DATA, RAW]
          default: "JSON"
        matchType:
          type: string
          enum: [EXACT, REGEX, CONTAINS]
          default: "EXACT"
        matchStrategy:
          type: string
          enum: [ALL, ANY]
          default: "ALL"
        bodyRules:
          type: object
          additionalProperties: true
        strictBodyStructure:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0
        status:
          type: boolean
          default: true

    RequestScenarioData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        headers:
          type: object
        queryParams:
          type: object
        pathParams:
          type: object
        body:
          type: object
        bodyType:
          type: string
        matchType:
          type: string
        matchStrategy:
          type: string
        bodyRules:
          type: object
        strictBodyStructure:
          type: boolean
        priority:
          type: integer
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestScenarioResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Request scenario upserted successfully"
        action:
          type: string
          enum: [CREATED, UPDATED]
        data:
          $ref: '#/components/schemas/RequestScenarioData'

    RequestScenarioListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestScenarioData'

    # Response Scenario Models
    UpsertResponseScenarioRequest:
      type: object
      required:
        - requestScenarioId
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "e5f6a7b8-c9d0-1234-5678-9abcdef01234"
        requestScenarioId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-789abcdef012"
        name:
          type: string
          example: "200 Success Response"
        description:
          type: string
          nullable: true
          example: "Returns 200 OK with user profile data"
        statusCode:
          type: integer
          default: 200
          example: 200
        headers:
          type: object
          additionalProperties: true
          example: { "Content-Type": "application/json" }
        body:
          type: object
          additionalProperties: true
          example: { "id": "123", "name": "John Doe", "status": "ACTIVE" }
        responseType:
          type: string
          enum: [JSON, TEXT, FILE]
          default: "JSON"
        filePath:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        delayMs:
          type: integer
          default: 0
          example: 100
        weight:
          type: integer
          default: 100
          example: 100
        priority:
          type: integer
          default: 0
        status:
          type: boolean
          default: true

    ResponseScenarioData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestScenarioId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        statusCode:
          type: integer
        headers:
          type: object
        body:
          type: object
        responseType:
          type: string
        filePath:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        delayMs:
          type: integer
        weight:
          type: integer
        priority:
          type: integer
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResponseScenarioResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Response scenario upserted successfully"
        action:
          type: string
          enum: [CREATED, UPDATED]
        data:
          $ref: '#/components/schemas/ResponseScenarioData'

    ResponseScenarioListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResponseScenarioData'
